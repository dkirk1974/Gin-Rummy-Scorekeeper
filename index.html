<script>
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(pageId).classList.add('active');
      if (pageId === 'scorerPage') document.getElementById('tabScorer').classList.add('active');
      if (pageId === 'statsPage') document.getElementById('tabStats').classList.add('active');
      if (pageId === 'rulesPage') document.getElementById('tabRules').classList.add('active');
      
      scrollToTop();
    }

    function handleFormState() {
      const type = document.getElementById('typeSelect').value;
      const ginSec = document.getElementById('ginSection');
      const knockSec = document.getElementById('knockSection');
      const banner = document.getElementById('knockPreviewBanner');

      if (type === 'gin') {
        ginSec.style.display = 'block';
        knockSec.style.display = 'none';
        banner.style.display = 'none';
      } else {
        ginSec.style.display = 'none';
        knockSec.style.display = 'block';
        calculateKnockOutcome();
      }
    }

    function calculateKnockOutcome() {
      const type = document.getElementById('typeSelect').value;
      const banner = document.getElementById('knockPreviewBanner');
      
      if (type === 'gin') {
        banner.style.display = 'none';
        return null;
      }

      const knockerKey = document.getElementById('knockerSelect').value;
      const defenderKey = knockerKey === 'nancy' ? 'darren' : 'nancy';
      
      const knockerName = knockerKey === 'nancy' ? 'Nancy' : 'Darren';
      const defenderName = defenderKey === 'nancy' ? 'Nancy' : 'Darren';

      const kW = parseInt(document.getElementById('knockerValue').value) || 0;
      const dW = parseInt(document.getElementById('defenderValue').value) || 0;

      banner.style.display = 'block';

      if (kW < dW) {
        const pts = dW - kW;
        banner.className = 'preview-banner preview-knock';
        banner.innerText = `👍 ${knockerName} wins ${pts} pts (Successful Knock)`;
        return { winner: knockerKey, loser: defenderKey, pts: pts, loserDw: dW };
      } else {
        const pts = (kW - dW) + 25;
        banner.className = 'preview-banner preview-undercut';
        banner.innerText = `⚡ UNDERCUT! ${defenderName} wins ${pts} pts (+25 Bonus)`;
        return { winner: defenderKey, loser: knockerKey, pts: pts, loserDw: kW };
      }
    }

    // --- AUDIO SYNTHESIZER FOR CONTINUOUS LOOPING SOUNDS ---
    let audioCtx = null;
    let loopInterval = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playClapBurst() {
      try {
        const ctx = getAudioContext();
        const bufferSize = ctx.sampleRate * 0.12;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.03));
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1000 + Math.random() * 800;
        filter.Q.value = 1.2;
        noise.connect(filter);
        filter.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    function startClappingLoop() {
      stopAudioLoop();
      loopInterval = setInterval(() => {
        playClapBurst();
        setTimeout(playClapBurst, 40);
        setTimeout(playClapBurst, 90);
      }, 400);
    }

    function playFireworkSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.35);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);

        setTimeout(() => {
          try {
            const bSize = ctx.sampleRate * 0.6;
            const bBuf = ctx.createBuffer(1, bSize, ctx.sampleRate);
            const bData = bBuf.getChannelData(0);
            for (let i = 0; i < bSize; i++) {
              bData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.15));
            }
            const bSource = ctx.createBufferSource();
            bSource.buffer = bBuf;
            const bFilter = ctx.createBiquadFilter();
            bFilter.type = 'lowpass';
            bFilter.frequency.value = 400;
            bSource.connect(bFilter);
            bFilter.connect(ctx.destination);
            bSource.start();
          } catch(err){}
        }, 350);
      } catch(e) {}
    }

    function startFireworksAudioLoop() {
      stopAudioLoop();
      playFireworkSound();
      loopInterval = setInterval(() => {
        playFireworkSound();
      }, 1400);
    }

    function stopAudioLoop() {
      if (loopInterval) {
        clearInterval(loopInterval);
        loopInterval = null;
      }
    }

    // --- CANVAS PARTICLE ANIMATIONS ---
    let canvas, ctx;
    let animationId = null;
    let particles = [];
    let currentFxType = null;

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function startConfettiAnimation() {
      currentFxType = 'confetti';
      particles = [];
      canvas.style.display = 'block';
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 10 + 5,
          h: Math.random() * 6 + 3,
          color: ['#2563eb', '#dc2626', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899'][Math.floor(Math.random()*6)],
          vy: Math.random() * 3 + 2,
          vx: Math.random() * 2 - 1,
          rot: Math.random() * 360,
          vRot: Math.random() * 6 - 3
        });
      }
      runAnimationLoop();
    }

    function startFireworksAnimation() {
      currentFxType = 'fireworks';
      particles = [];
      canvas.style.display = 'block';
      for(let i=0; i<3; i++){
        createFireworkShell();
      }
      runAnimationLoop();
    }

    function createFireworkShell() {
      const startX = Math.random() * (canvas.width - 200) + 100;
      const targetY = Math.random() * (canvas.height * 0.5) + 50;
      particles.push({
        isShell: true,
        x: startX,
        y: canvas.height,
        targetY: targetY,
        vx: (Math.random() - 0.5) * 2,
        vy: -11 - Math.random() * 4,
        color: ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#ec4899'][Math.floor(Math.random()*5)]
      });
    }

    function explodeShell(x, y, color) {
      const count = 45;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          isShell: false,
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01,
          color: color
        });
      }
    }

    function runAnimationLoop() {
      cancelAnimationFrame(animationId);
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (currentFxType === 'confetti') {
          particles.forEach(p => {
            p.y += p.vy;
            p.x += p.vx + Math.sin(p.y * 0.02) * 0.5;
            p.rot += p.vRot;
            if (p.y > canvas.height) {
              p.y = -20;
              p.x = Math.random() * canvas.width;
            }
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rot * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });
        } else if (currentFxType === 'fireworks') {
          if (Math.random() < 0.04 && particles.filter(p => p.isShell).length < 4) {
            createFireworkShell();
          }

          for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            if (p.isShell) {
              p.x += p.vx;
              p.y += p.vy;
              ctx.beginPath();
              ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
              ctx.fillStyle = p.color;
              ctx.fill();
              if (p.y <= p.targetY || p.vy >= 0) {
                explodeShell(p.x, p.y, p.color);
                particles.splice(i, 1);
              }
            } else {
              p.x += p.vx;
              p.y += p.vy;
              p.vy += 0.12;
              p.alpha -= p.decay;
              if (p.alpha <= 0) {
                particles.splice(i, 1);
                continue;
              }
              ctx.save();
              ctx.globalAlpha = p.alpha;
              ctx.beginPath();
              ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
              ctx.fillStyle = p.color;
              ctx.fill();
              ctx.restore();
            }
          }
        }
        animationId = requestAnimationFrame(loop);
      }
      loop();
    }

    function stopAnimationFX() {
      cancelAnimationFrame(animationId);
      canvas.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      currentFxType = null;
    }

    let milestoneQueue = [];

    function showWinnerModal(winner, score, target) {
      document.getElementById('modalWinnerTitle').innerText = `🎉 ${winner} Wins! 🎉`;
      document.getElementById('modalWinnerSub').innerText = `${winner} reached ${score} points! (Target was ${target})`;
      document.getElementById('winnerModal').classList.add('active');
      startClappingLoop();
      startConfettiAnimation();
    }

    function closeWinnerModal() {
      stopAudioLoop();
      stopAnimationFX();
      document.getElementById('winnerModal').classList.remove('active');
      finishGame();
    }

    function queueMilestoneAlert(title, subtitle, icon = '🎆') {
      milestoneQueue.push({ title, subtitle, icon });
      if (!document.getElementById('milestoneModal').classList.contains('active') && 
          !document.getElementById('winnerModal').classList.contains('active')) {
        processNextMilestone();
      }
    }

    function processNextMilestone() {
      if (milestoneQueue.length === 0) return;
      const m = milestoneQueue.shift();
      document.getElementById('milestoneModalTitle').innerText = m.title;
      document.getElementById('milestoneModalSub').innerText = m.subtitle;
      document.getElementById('milestoneModalIcon').innerText = m.icon;
      document.getElementById('milestoneModal').classList.add('active');
      startFireworksAudioLoop();
      startFireworksAnimation();
    }

    function closeMilestoneModal() {
      stopAudioLoop();
      stopAnimationFX();
      document.getElementById('milestoneModal').classList.remove('active');
      if (milestoneQueue.length > 0) {
        setTimeout(processNextMilestone, 250);
      }
    }

    function showResetModal() {
      document.getElementById('resetModal').classList.add('active');
    }

    function closeResetModal() {
      document.getElementById('resetModal').classList.remove('active');
    }

    function confirmResetStats() {
      lifetime = {
        gamesPlayed: 0,
        nancy: { matchWins: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, biggestHand: 0, currentStreak: 0, maxStreak: 0 },
        darren: { matchWins: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, biggestHand: 0, currentStreak: 0, maxStreak: 0 }
      };
      saveToStorage();
      updateUI();
      closeResetModal();
    }

    const defaultLifetime = {
      gamesPlayed: 0,
      nancy: { matchWins: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, biggestHand: 0, currentStreak: 0, maxStreak: 0 },
      darren: { matchWins: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, biggestHand: 0, currentStreak: 0, maxStreak: 0 }
    };

    let lifetime = JSON.parse(localStorage.getItem('gin_lifetime_nd')) || defaultLifetime;

    let currentGame = JSON.parse(localStorage.getItem('gin_currentgame_nd')) || {
      nancy: { score: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, consecutiveHandsWon: 0 },
      darren: { score: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, consecutiveHandsWon: 0 },
      handsPlayed: 0,
      gameMode: '100',
      customTarget: 250,
      matchWinRecorded: false
    };

    if (currentGame.nancy.consecutiveHandsWon === undefined) currentGame.nancy.consecutiveHandsWon = 0;
    if (currentGame.darren.consecutiveHandsWon === undefined) currentGame.darren.consecutiveHandsWon = 0;
    if (currentGame.matchWinRecorded === undefined) currentGame.matchWinRecorded = false;

    let handHistory = JSON.parse(localStorage.getItem('gin_history_nd')) || [];

    function saveToStorage() {
      localStorage.setItem('gin_lifetime_nd', JSON.stringify(lifetime));
      localStorage.setItem('gin_currentgame_nd', JSON.stringify(currentGame));
      localStorage.setItem('gin_history_nd', JSON.stringify(handHistory));
    }

    function handleGameModeChange() {
      const mode = document.getElementById('gameModeSelect').value;
      const customInput = document.getElementById('customTargetInput');
      const customWrapper = document.getElementById('customTargetWrapper');
      const badge = document.getElementById('targetBadge');

      currentGame.gameMode = mode;
      if (mode === 'custom') {
        currentGame.customTarget = parseInt(customInput.value) || 250;
      }
      saveToStorage();

      if (mode === '100') {
        customWrapper.style.display = 'none';
        badge.innerText = 'Target: First to 100 Points';
      } else if (mode === 'custom') {
        customWrapper.style.display = 'block';
        badge.innerText = `Target: First to ${currentGame.customTarget} Points`;
      } else if (mode === 'endless') {
        customWrapper.style.display = 'none';
        badge.innerText = 'Target: Endless / Open-Ended Game';
      }
    }

    function updateGameTypeLockState() {
      const modeSelect = document.getElementById('gameModeSelect');
      const customInput = document.getElementById('customTargetInput');
      const hasStarted = currentGame.handsPlayed > 0;

      modeSelect.disabled = hasStarted;
      customInput.disabled = hasStarted;
    }

    document.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('fxCanvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();

      document.getElementById('gameModeSelect').addEventListener('change', handleGameModeChange);
      document.getElementById('customTargetInput').addEventListener('change', handleGameModeChange);
      document.getElementById('typeSelect').addEventListener('change', handleFormState);
      document.getElementById('knockerSelect').addEventListener('change', calculateKnockOutcome);
      document.getElementById('knockerValue').addEventListener('input', calculateKnockOutcome);
      document.getElementById('defenderValue').addEventListener('input', calculateKnockOutcome);

      document.getElementById('handForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        if (currentGame.matchWinRecorded) return;

        const type = document.getElementById('typeSelect').value;
        let winner, loser, pts, loserDw;

        if (type === 'gin') {
          winner = document.getElementById('ginWinnerSelect').value;
          loser = winner === 'nancy' ? 'darren' : 'nancy';
          loserDw = parseInt(document.getElementById('ginDefenderValue').value) || 0;
          pts = loserDw + 25;
        } else {
          const result = calculateKnockOutcome();
          winner = result.winner;
          loser = result.loser;
          pts = result.pts;
          loserDw = result.loserDw;
        }

        const winnerNameFormatted = winner === 'nancy' ? 'Nancy' : 'Darren';

        const handSnapshot = {
          winner: winner,
          loser: loser,
          pts: pts,
          loserDw: loserDw
        };
        handHistory.push(handSnapshot);

        currentGame[winner].score += pts;
        currentGame[winner].handsWon += 1;
        currentGame[winner].totalPoints += pts;
        currentGame[winner].consecutiveHandsWon += 1;
        
        currentGame[loser].totalDeadwoodCaught += loserDw;
        currentGame[loser].handsLost += 1;
        currentGame.consecutiveHandsWon = 0;

        currentGame.handsPlayed += 1;

        lifetime[winner].handsWon += 1;
        lifetime[winner].totalPoints += pts;
        lifetime[loser].totalDeadwoodCaught += loserDw;
        lifetime[loser].handsLost += 1;

        const currentHighestHand = Math.max(lifetime.nancy.biggestHand, lifetime.darren.biggestHand);
        if (pts > currentHighestHand) {
          lifetime[winner].biggestHand = pts;
          queueMilestoneAlert(
            `🚀 New All-Time Hand Score Record!`,
            `${winnerNameFormatted} just scored ${pts} points in a single hand, setting a new all-time record!`
          );
        } else if (pts > lifetime[winner].biggestHand) {
          lifetime[winner].biggestHand = pts;
        }

        if (currentGame[winner].consecutiveHandsWon >= 3) {
          queueMilestoneAlert(
            `🔥 Hot Hand Streak!`,
            `${winnerNameFormatted} has won ${currentGame[winner].consecutiveHandsWon} consecutive hands in this game!`
          );
        }

        saveToStorage();
        updateUI();
        updateGameTypeLockState();

        document.getElementById('ginDefenderValue').value = 0;
        document.getElementById('knockerValue').value = 0;
        document.getElementById('defenderValue').value = 0;
        handleFormState();

        const mode = currentGame.gameMode;
        let target = null;
        if (mode === '100') target = 100;
        else if (mode === 'custom') target = currentGame.customTarget;

        if (target !== null && !currentGame.matchWinRecorded) {
          if (currentGame.nancy.score >= target || currentGame.darren.score >= target) {
            currentGame.matchWinRecorded = true;

            const matchWinner = currentGame.nancy.score >= target ? 'Nancy' : 'Darren';
            const winnerKey = matchWinner.toLowerCase();
            const winnerScore = currentGame[winnerKey].score;
            
            lifetime[winnerKey].matchWins += 1;
            lifetime[winnerKey].currentStreak += 1;
            const opposingKey = winnerKey === 'nancy' ? 'darren' : 'nancy';
            lifetime[opposingKey].currentStreak = 0;

            const currentHighestStreak = Math.max(lifetime.nancy.maxStreak, lifetime.darren.maxStreak);
            if (lifetime[winnerKey].currentStreak > currentHighestStreak) {
              lifetime[winnerKey].maxStreak = lifetime[winnerKey].currentStreak;
              queueMilestoneAlert(
                `🏆 New All-Time Match Streak Record!`,
                `${matchWinner} has set a new all-time record with ${lifetime[winnerKey].maxStreak} consecutive match wins!`
              );
            } else if (lifetime[winnerKey].currentStreak > lifetime[winnerKey].maxStreak) {
              lifetime[winnerKey].maxStreak = lifetime[winnerKey].currentStreak;
            }

            saveToStorage();

            setTimeout(() => {
              showWinnerModal(matchWinner, winnerScore, target);
            }, 150);
          }
        }
      });

      document.getElementById('gameModeSelect').value = currentGame.gameMode;
      if (currentGame.gameMode === 'custom') {
        document.getElementById('customTargetInput').value = currentGame.customTarget;
      }
      handleGameModeChange();
      handleFormState();
      updateUI();
      updateGameTypeLockState();

      if (currentGame.handsPlayed > 0 && !currentGame.matchWinRecorded) {
        document.getElementById('resumeModal').classList.add('active');
      }
    });

    function undoLastHand() {
      if (handHistory.length === 0 || currentGame.handsPlayed === 0) return;

      const lastHand = handHistory.pop();
      const { winner, loser, pts, loserDw } = lastHand;

      currentGame[winner].score -= pts;
      currentGame[winner].handsWon -= 1;
      currentGame[winner].totalPoints -= pts;
      if (currentGame[winner].consecutiveHandsWon > 0) {
        currentGame[winner].consecutiveHandsWon -= 1;
      }

      currentGame[loser].totalDeadwoodCaught -= loserDw;
      currentGame[loser].handsLost -= 1;
      currentGame.handsPlayed -= 1;

      lifetime[winner].handsWon -= 1;
      lifetime[winner].totalPoints -= pts;
      lifetime[loser].totalDeadwoodCaught -= loserDw;
      lifetime[loser].handsLost -= 1;

      saveToStorage();
      updateUI();
      updateGameTypeLockState();
    }

    function finishGame() {
      lifetime.gamesPlayed += 1;

      currentGame = {
        nancy: { score: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, consecutiveHandsWon: 0 },
        darren: { score: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, consecutiveHandsWon: 0 },
        handsPlayed: 0,
        gameMode: '100',
        customTarget: 250,
        matchWinRecorded: false
      };
      handHistory = [];

      saveToStorage();
      updateUI();
      document.getElementById('gameModeSelect').value = '100';
      handleGameModeChange();
      updateGameTypeLockState();
    }

    function startFreshGame() {
      currentGame = {
        nancy: { score: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, consecutiveHandsWon: 0 },
        darren: { score: 0, handsWon: 0, totalPoints: 0, totalDeadwoodCaught: 0, handsLost: 0, consecutiveHandsWon: 0 },
        handsPlayed: 0,
        gameMode: '100',
        customTarget: 250,
        matchWinRecorded: false
      };
      handHistory = [];
      saveToStorage();
      document.getElementById('resumeModal').classList.remove('active');
      document.getElementById('gameModeSelect').value = '100';
      handleGameModeChange();
      updateUI();
      updateGameTypeLockState();
    }

    function closeResumeModal() {
      document.getElementById('resumeModal').classList.remove('active');
    }

    function updateUI() {
      document.getElementById('p1Score').innerText = currentGame.nancy.score;
      document.getElementById('p2Score').innerText = currentGame.darren.score;

      const undoBtn = document.getElementById('undoBtn');
      if (handHistory.length > 0) {
        undoBtn.style.display = 'block';
        undoBtn.innerText = `↩ Undo Last Entry (${handHistory.length} recorded)`;
      } else {
        undoBtn.style.display = 'none';
      }

      const totalH = currentGame.handsPlayed;
      if (totalH > 0) {
        const nWinPct = ((currentGame.nancy.handsWon / totalH) * 100).toFixed(1);
        const dWinPct = ((currentGame.darren.handsWon / totalH) * 100).toFixed(1);
        const nAvgPts = currentGame.nancy.handsWon ? (currentGame.nancy.totalPoints / currentGame.nancy.handsWon).toFixed(1) : '0.0';
        const dAvgPts = currentGame.darren.handsWon ? (currentGame.darren.totalPoints / currentGame.darren.handsWon).toFixed(1) : '0.0';
        const nAvgDw = currentGame.nancy.handsLost ? (currentGame.nancy.totalDeadwoodCaught / currentGame.nancy.handsLost).toFixed(1) : '0.0';
        const dAvgDw = currentGame.darren.handsLost ? (currentGame.darren.totalDeadwoodCaught / currentGame.darren.handsLost).toFixed(1) : '0.0';

        document.getElementById('gameStats').innerHTML = `
          <table>
            <tr><th>Metric</th><th>Nancy</th><th>Darren</th></tr>
            <tr><td>Hands Won</td><td>${currentGame.nancy.handsWon}</td><td>${currentGame.darren.handsWon}</td></tr>
            <tr><td>Hand Win %</td><td>${nWinPct}%</td><td>${dWinPct}%</td></tr>
            <tr><td>Avg Pts / Hand Won</td><td>${nAvgPts}</td><td>${dAvgPts}</td></tr>
            <tr><td>Avg Deadwood Caught With</td><td>${nAvgDw} pts</td><td>${dAvgDw} pts</td></tr>
          </table>
        `;
      } else {
        document.getElementById('gameStats').innerText = "No hands played yet in current game.";
      }

      const totalG = lifetime.gamesPlayed;
      const totalLifetimeHands = lifetime.nancy.handsWon + lifetime.darren.handsWon;

      const nGameWinPct = totalG ? ((lifetime.nancy.matchWins / totalG) * 100).toFixed(1) : '0.0';
      const dGameWinPct = totalG ? ((lifetime.darren.matchWins / totalG) * 100).toFixed(1) : '0.0';

      const nLifeHandWinPct = totalLifetimeHands ? ((lifetime.nancy.handsWon / totalLifetimeHands) * 100).toFixed(1) : '0.0';
      const dLifeHandWinPct = totalLifetimeHands ? ((lifetime.darren.handsWon / totalLifetimeHands) * 100).toFixed(1) : '0.0';

      const nLifeAvgPts = lifetime.nancy.handsWon ? (lifetime.nancy.totalPoints / lifetime.nancy.handsWon).toFixed(1) : '0.0';
      const dLifeAvgPts = lifetime.darren.handsWon ? (lifetime.darren.totalPoints / lifetime.darren.handsWon).toFixed(1) : '0.0';

      const nLifeAvgDw = lifetime.nancy.handsLost ? (lifetime.nancy.totalDeadwoodCaught / lifetime.nancy.handsLost).toFixed(1) : '0.0';
      const dLifeAvgDw = lifetime.darren.handsLost ? (lifetime.darren.totalDeadwoodCaught / lifetime.darren.handsLost).toFixed(1) : '0.0';

      document.getElementById('lifetimeStats').innerHTML = `
        <p style="margin-bottom:8px;"><strong>Total Games Played:</strong> ${totalG}</p>
        <table>
          <tr><th>Lifetime Metric</th><th>Nancy</th><th>Darren</th></tr>
          <tr><td>Match Wins (Win %)</td><td>${lifetime.nancy.matchWins} (${nGameWinPct}%)</td><td>${lifetime.darren.matchWins} (${dGameWinPct}%)</td></tr>
          <tr><td>Hand Win %</td><td>${nLifeHandWinPct}%</td><td>${dLifeHandWinPct}%</td></tr>
          <tr><td>Avg Pts / Hand Won</td><td>${nLifeAvgPts}</td><td>${dLifeAvgPts}</td></tr>
          <tr><td>Avg Deadwood Caught With</td><td>${nLifeAvgDw} pts</td><td>${dLifeAvgDw} pts</td></tr>
          <tr><td>Biggest Hand Score</td><td>${lifetime.nancy.biggestHand} pts</td><td>${lifetime.darren.biggestHand} pts</td></tr>
          <tr><td>Current Win Streak</td><td>${lifetime.nancy.currentStreak}</td><td>${lifetime.darren.currentStreak}</td></tr>
          <tr><td>Longest Win Streak</td><td>${lifetime.nancy.maxStreak}</td><td>${lifetime.darren.maxStreak}</td></tr>
        </table>
      `;
    }
  </script>
